[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttd-onboarding-lab"
version = "0.1.0"
description = "Fictional commercial intelligence preparation lab"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ttd-lab = "ttd_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ttd_lab = ["*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires LAB_TEST_DATABASE_URL pointing at a disposable lab database"]
