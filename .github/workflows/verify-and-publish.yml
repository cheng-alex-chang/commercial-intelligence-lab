name: Verify and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ttd_lab
          POSTGRES_PASSWORD: ttd_lab_local
          POSTGRES_DB: ttd_lab_scale
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ttd_lab -d ttd_lab_scale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install lab
        run: pip install -e '.[dev]'
      - name: Create dedicated test database
        run: >-
          python -c "import psycopg; c = psycopg.connect('postgresql://ttd_lab:ttd_lab_local@127.0.0.1:55432/ttd_lab_scale', autocommit=True); c.execute('CREATE DATABASE ttd_lab_test'); c.close()"
      - name: Verify contracts and PostgreSQL behavior
        env:
          LAB_TEST_DATABASE_URL: postgresql://ttd_lab:ttd_lab_local@127.0.0.1:55432/ttd_lab_test
        run: python -m pytest -q
      - name: Reproduce and reconcile the public sample
        run: |
          ttd-lab generate
          ttd-lab validate data/fixtures-commercial/baseline
          ttd-lab init-db
          ttd-lab load data/fixtures-commercial/baseline
          ttd-lab export
          python scripts/build_demo.py
          python scripts/build_report.py
          git diff --exit-code -- site/demo.json site/reports
          test -z "$(git ls-files --others --exclude-standard site/reports)"

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
